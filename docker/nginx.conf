# Serve the SPA and reverse-proxy the API on one origin (so the session cookie
# is same-origin). The API's root paths collide with SPA client routes, so a
# full-page navigation (Accept: text/html) is served the SPA, while fetch/XHR
# and SSE calls are proxied to the API -- the same split the Vite dev proxy does.
map $http_accept $spa_nav {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/(auth|projects|targets|runs|artifacts|revisions|apps|prompts|settings|health)(/|$) {
        if ($spa_nav) {
            rewrite ^ /index.html last;   # full-page SPA navigation
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        # Server-sent events (/runs/{id}/events): no buffering, long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
