# Serve the SPA and reverse-proxy the API on one origin (so the session cookie
# is same-origin). The API's root paths collide with SPA client routes, so a
# full-page navigation (Accept: text/html) is served the SPA, while fetch/XHR
# and SSE calls are proxied to the API -- the same split the Vite dev proxy does.
map $http_accept $spa_nav {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/(auth|projects|targets|runs|artifacts|revisions|apps|prompts|settings|health)(/|$) {
        # These URLs answer with the SPA *or* with JSON depending on Accept, so
        # the response is only cacheable per-Accept. Without this, a browser
        # that navigated to /projects caches the HTML shell under that URL and
        # then serves it to the app's own fetch("/projects"), which parses the
        # document as the project list and blanks the page on every refresh.
        add_header Vary Accept always;

        if ($spa_nav) {
            rewrite ^ /index.html last;   # full-page SPA navigation
        }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        # Server-sent events (/runs/{id}/events): no buffering, long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }

    # The SPA shell is reachable at every client route, including the ones that
    # collide with API paths, so it must never be cached under one of them.
    # `Vary: Accept` is the correctness fix above; this is the belt to its
    # braces, and costs nothing (the hashed asset bundles stay cacheable).
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Vary Accept always;
    }
}
