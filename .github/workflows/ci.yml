# CI for THIS repo -- the harness itself.
#
# Not to be confused with .github/workflows/playwright.yml, which is harness
# *output*: bootstrap pushes that file into each customer's target repo, where it
# runs their generated suite. This workflow never runs the generated tests; it
# runs our own backend suite, our own portal suite and lint.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: server (pytest + ruff)
    runs-on: ubuntu-latest

    services:
      # The DB-backed tests are the majority of the suite and conftest.py skips
      # them when Postgres is unreachable, so a job without a database would
      # report success having run almost nothing. QA_REQUIRE_DB (below) turns
      # that skip into a failure here.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://qa:qa@localhost:5432/qa
      # Fail loudly instead of skipping if Postgres is not reachable: a green
      # tick must never mean "the DB-backed tests all skipped".
      QA_REQUIRE_DB: "1"
      # The same bargain for the two tests that really start containers (P4).
      # They are the only proof the container path works at all, so a skip here
      # would make this phase's green tick meaningless. The runners have Docker.
      QA_REQUIRE_DOCKER: "1"
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: qa
      S3_SECRET_KEY: qa-secret
      S3_BUCKET: qa-artifacts

    steps:
      - uses: actions/checkout@v4

      # Not a `services:` entry: SeaweedFS needs command arguments
      # (`server -s3 ...`) and a service container cannot be given any. The
      # sandboxed run has to read its revision's blobs from a real store, so
      # the Docker-backed test needs one published on the host.
      - name: Start the object store
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            chrislusf/seaweedfs:latest server -s3 -dir=/data
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8333/; then
              echo "object store up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the object store never came up"; docker logs seaweedfs; exit 1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        working-directory: server
        run: uv sync --locked

      - name: Lint
        working-directory: server
        run: uv run ruff check .

      # conftest.py builds the schema by running the Alembic migrations from
      # zero, never Base.metadata.create_all. That is the only thing here that
      # catches migration drift, so keep it: do not "speed this up" by creating
      # the schema from the models.
      - name: Tests
        working-directory: server
        run: uv run pytest -rs --junit-xml=junit.xml

      - name: Fail if any test skipped
        working-directory: server
        run: |
          # Belt and braces around QA_REQUIRE_DB: that catches an unreachable
          # database, this catches a test that went quiet for any other reason.
          # Reads the report the step above wrote; it does not re-run the suite.
          skipped=$(python3 -c "import xml.etree.ElementTree as E; \
            print(sum(int(s.get('skipped', 0)) for s in E.parse('junit.xml').iter('testsuite')))")
          echo "skipped: $skipped"
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped test(s) skipped; CI expects the whole suite to run"
            exit 1
          fi

  frontend:
    name: web (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Tests
        working-directory: web
        run: npm test
