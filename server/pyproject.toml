[project]
name = "qa-portal-server"
version = "0.1.0"
description = "FastAPI backend for the QA admin portal (wraps the existing file/shell QA harness)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "itsdangerous>=2.1",
    "alembic>=1.13",
    # app/delivery talks to GitHub over REST (replaces the `gh` CLI).
    "httpx>=0.27",
    # Used directly by app/schemas.py and app/auth_api.py, not just via fastapi.
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow: correctness (F), style errors (E), import order (I),
# modern syntax (UP) and the bugbear checks that catch real mistakes (B).
# Anything broader turns a linter into a refactoring backlog.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's whole dependency-injection idiom is a call in a default argument.
    "B008",
    # Would rewrite `class Step(str, Enum)` / `class RunStatus(str, Enum)` to
    # StrEnum. Do not "modernise" these: the two bases do not stringify the
    # same way. `str(Step.PLAN)` is "Step.PLAN" under (str, Enum) and "plan"
    # under StrEnum, so the swap silently changes every place a member reaches
    # a string. The columns are VARCHAR(20) built by `_enum_col` in
    # app/models.py -- Enum(native_enum=False, values_callable=...,
    # validate_strings=True) -- and the CHECK constraint in
    # alembic/versions/*_initial_schema.py is written in terms of the member
    # *values*. Changing the base changes what round-trips through that column.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files, and its one-column-per-line `sa.Column(...)` style
# runs past 100 chars for any column with a server default or a long Enum. Every
# future autogenerated revision will look the same, so line length is excluded
# here rather than hand-reflowed once per migration. Everything else -- import
# order included -- is still enforced, so a hand-edited migration stays honest.
"alembic/versions/*" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
